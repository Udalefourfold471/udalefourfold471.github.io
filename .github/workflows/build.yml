name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AC6E0F: ${{ secrets.AC6E0F }}
          B67334: ${{ secrets.B67334 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AC6E0F', ''), os.environ.get('B67334', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- d59a1f6632d29be172e53b73445dd7675d8c4983f2fd23 -->', a)
          if b:
              patched = patched.replace('<!-- da4b09052e66158e2360 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
